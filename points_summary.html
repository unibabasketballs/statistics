<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Match Report - Uniba Basketball</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap');
        
        :root {
            --slate-900: #0f172a;
            --emerald-700: #047857;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9;
            color: var(--slate-900);
            margin: 0;
            padding: 0;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* A4 Portrait Optimization */
        .report-page {
            width: 210mm;
            height: 297mm; /* Fixed height for A4 */
            margin: 0 auto;
            background: white;
            padding: 10mm 12mm; /* Reduced padding */
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .table-official {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px; /* Reduced font size */
        }

        .table-official th {
            background: #f8fafc;
            border-bottom: 1.5px solid var(--slate-900);
            padding: 4px 2px; /* Tighter padding */
            font-weight: 800;
            text-transform: uppercase;
            font-size: 8px;
            letter-spacing: 0.05em;
        }

        .table-official td {
            padding: 4px 2px; /* Tighter padding */
            border-bottom: 1px solid #f1f5f9;
        }

        .row-even { background-color: #fafafa; }

        @media print {
            @page { 
                size: A4 portrait; 
                margin: 0; 
            }
            body { background: white; }
            .no-print { display: none !important; }
            .report-page { 
                box-shadow: none; 
                margin: 0; 
                width: 210mm;
                height: 297mm;
                padding: 10mm;
            }
        }
    </style>
</head>
<body class="py-4">

    <div class="max-w-[210mm] mx-auto no-print flex justify-between items-center mb-4 px-4">
        <a href="index.html" class="flex items-center gap-2 text-slate-500 hover:text-slate-900 font-bold text-xs uppercase tracking-widest">
            <i class="fa-solid fa-chevron-left"></i> Dashboard
        </a>
        <button onclick="window.print()" class="bg-slate-900 text-white px-5 py-1.5 rounded-full font-bold text-xs uppercase shadow hover:bg-slate-800 transition-all flex items-center gap-2">
            <i class="fa-solid fa-print"></i> Cetak Report
        </button>
    </div>

    <div class="report-page">
        <header class="flex justify-between items-center border-b-2 border-slate-900 pb-3 mb-4">
            <div class="flex items-center gap-3">
                <img src="image/71.png" class="h-10 w-10 object-contain" onerror="this.style.display='none'">
                <div>
                    <h1 class="text-xl font-black uppercase tracking-tighter leading-none">Uniba<span class="text-emerald-700">Basketball</span></h1>
                    <p class="text-[7px] font-bold text-slate-400 uppercase tracking-[0.3em] mt-0.5">Player Point Report</p>
                </div>
            </div>
            <div class="text-right">
                <div id="current-date" class="text-[9px] font-black uppercase"></div>
                <div id="match-id" class="mono text-[8px] text-slate-400 tracking-tighter">ID: -</div>
            </div>
        </header>

        <div class="flex items-stretch gap-0.5 mb-6 bg-slate-900 rounded-xl overflow-hidden shadow-md text-white">
            <div class="flex-1 p-3 text-center border-r border-slate-700">
                <p class="text-[7px] font-bold text-emerald-400 uppercase tracking-widest mb-1">Home Team</p>
                <h2 id="home-name-display" class="text-sm font-black uppercase truncate mb-0.5">-</h2>
                <div id="home-total-points" class="mono text-3xl font-black leading-none">0</div>
            </div>
            <div class="w-12 flex items-center justify-center bg-slate-800 font-black italic text-slate-500 text-[10px]">VS</div>
            <div class="flex-1 p-3 text-center">
                <p class="text-[7px] font-bold text-slate-400 uppercase tracking-widest mb-1">Away Team</p>
                <h2 id="away-name-display" class="text-sm font-black uppercase truncate mb-0.5">-</h2>
                <div id="away-total-points" class="mono text-3xl font-black leading-none">0</div>
            </div>
        </div>

        <div class="flex flex-col flex-grow space-y-6">
            <section>
                <div class="flex justify-between items-end mb-1.5 px-1">
                    <h3 class="font-black uppercase text-[10px] border-l-3 border-emerald-600 pl-2">Home: <span id="home-table-title" class="text-emerald-700">-</span></h3>
                    <span class="text-[7px] font-bold text-slate-400 uppercase">Points Log</span>
                </div>
                <table class="table-official">
                    <thead>
                        <tr>
                            <th class="text-center w-8">#</th>
                            <th class="text-left">Player Name</th>
                            <th class="text-center w-12">2PT</th>
                            <th class="text-center w-12">3PT</th>
                            <th class="text-center w-12">FT</th>
                            <th class="text-right w-16 pr-3">Total</th>
                        </tr>
                    </thead>
                    <tbody id="home-table-body"></tbody>
                </table>
            </section>

            <section>
                <div class="flex justify-between items-end mb-1.5 px-1">
                    <h3 class="font-black uppercase text-[10px] border-l-3 border-slate-400 pl-2">Away: <span id="away-table-title" class="text-slate-600">-</span></h3>
                    <span class="text-[7px] font-bold text-slate-400 uppercase">Points Log</span>
                </div>
                <table class="table-official">
                    <thead>
                        <tr>
                            <th class="text-center w-8">#</th>
                            <th class="text-left">Player Name</th>
                            <th class="text-center w-12">2PT</th>
                            <th class="text-center w-12">3PT</th>
                            <th class="text-center w-12">FT</th>
                            <th class="text-right w-16 pr-3">Total</th>
                        </tr>
                    </thead>
                    <tbody id="away-table-body"></tbody>
                </table>
            </section>
        </div>

        <div class="mt-auto pt-4">
            <div class="grid grid-cols-3 gap-8">
                <div class="text-center">
                    <div class="border-b border-slate-200 h-12 mb-1"></div>
                    <p class="text-[7px] font-black uppercase text-slate-400">Official Scorer</p>
                </div>
                <div class="text-center">
                    <div class="border-b border-slate-200 h-12 mb-1"></div>
                    <p class="text-[7px] font-black uppercase text-slate-400">Referee</p>
                </div>
                <div class="text-center">
                    <div class="border-b border-slate-200 h-12 mb-1"></div>
                    <p class="text-[7px] font-black uppercase text-slate-400">Commissioner</p>
                </div>
            </div>
            
            <footer class="mt-4 pt-2 border-t border-slate-50 text-center">
                <p class="text-[7px] font-bold text-slate-300 uppercase tracking-[0.5em]">@unibabasketball • Official Stats System</p>
            </footer>
        </div>
    </div>

    <script>
        function generateReport() {
            const teams = JSON.parse(localStorage.getItem('elite_teams'));
            const stats = JSON.parse(localStorage.getItem('elite_stats'));

            if (!teams || !stats) return;

            const now = new Date();
            document.getElementById('current-date').innerText = now.toLocaleDateString('id-ID', { 
                day: 'numeric', month: 'long', year: 'numeric' 
            });
            document.getElementById('match-id').innerText = "MATCH_ID: UB-" + now.getTime().toString().slice(-6);

            document.getElementById('home-name-display').innerText = teams.home.name;
            document.getElementById('home-table-title').innerText = teams.home.name;
            document.getElementById('away-name-display').innerText = teams.away.name;
            document.getElementById('away-table-title').innerText = teams.away.name;

            renderTeamTable('home', teams.home.players, stats);
            renderTeamTable('away', teams.away.players, stats);
        }

        function renderTeamTable(teamKey, players, stats) {
            const tbody = document.getElementById(`${teamKey}-table-body`);
            const totalScoreDisplay = document.getElementById(`${teamKey}-total-points`);
            let teamTotal = 0;

            const sortedPlayers = [...players].sort((a, b) => parseInt(a.no) - parseInt(b.no));

            tbody.innerHTML = sortedPlayers.map((p, index) => {
                const s = stats[p.id] || { score: 0, '2pt': {m:0}, '3pt': {m:0}, 'ft': {m:0} };
                teamTotal += s.score;
                const isZero = s.score === 0;
                const rowClass = index % 2 === 1 ? 'row-even' : '';

                return `
                    <tr class="${rowClass} ${isZero ? 'opacity-30' : ''}">
                        <td class="text-center mono font-bold text-slate-400">${p.no}</td>
                        <td class="font-bold uppercase tracking-tighter text-slate-700" style="font-size: 9px">${p.name}</td>
                        <td class="text-center mono text-slate-500">${s['2pt']?.m || 0}</td>
                        <td class="text-center mono text-slate-500">${s['3pt']?.m || 0}</td>
                        <td class="text-center mono text-slate-500">${s['ft']?.m || 0}</td>
                        <td class="text-right pr-3 font-black mono text-[11px] ${!isZero ? 'text-emerald-700' : ''}">${s.score}</td>
                    </tr>
                `;
            }).join('');

            totalScoreDisplay.innerText = teamTotal;
        }

        window.onload = generateReport;
    </script>
</body>
</html>
